
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle7-web
  labels:
    app: vle7-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle7-web
  template:
    metadata:
      labels:
        app: vle7-web
    spec:
      containers:
        - name: vle7-web
          image: DOCKERHUB_USERNAME/vle7-web:latest
          ports:
            - containerPort: 80
